[package]
name = "forgevyn"
version = "0.1.3"
description = "Forgevyn — professional client-side video studio, packaged as a native desktop app"
authors = ["Forgevyn"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "forgevyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri dev` / `tauri build` on platforms that need the custom protocol.
custom-protocol = ["tauri/custom-protocol"]
